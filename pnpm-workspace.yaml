# Settings only: this repo is a single package, so there is no `packages` list.
# scripts/bump-sentry-api.sh pins every new @sentry/api release within the hour.
# Exclude it from pnpm's minimumReleaseAge so those installs aren't held back
# once pnpm applies a release-age default.
minimumReleaseAgeExclude:
  - '@sentry/api'
