<svg xmlns="http://www.w3.org/2000/svg" class="dg" data-diagram="tunnel-flow" data-dur="1" width="1520" height="524" viewBox="0 0 760 262" role="img" aria-label="Without a tunnel, ad blockers block requests to Sentry. With a tunnel, the browser sends them to your own origin."><style>.dg{--bg:#FFFFFF;--ink:#181225;--quiet:#776589;--edge:#9386A0;--grid:#E7E1EC;--accent:#7553FF;--good:#92DD00;--bad:#FF45A8;--warn:#FDB81B;--good-ink:#5B8211;--bad-ink:#CE3A8C;--warn-ink:#986F1F}@media (prefers-color-scheme: dark){.dg{--bg:#181225;--ink:#F6F6F8;--quiet:#C6BECF;--edge:#9386A0;--grid:#352B47;--accent:#9E86FF;--good:#C0ED49;--bad:#FF70BC;--warn:#FFD00E;--good-ink:#C0ED49;--bad-ink:#FF70BC;--warn-ink:#FFD00E}}.dg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:var(--ink);font-size:13px}.dg .q{fill:var(--quiet)}.dg .s{font-size:11.5px}.dg .n{font-weight:600}.dg .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}.dg .lbl{font-size:11px;font-weight:600;letter-spacing:.06em;fill:var(--accent)}.dg .box{fill:var(--bg);stroke:var(--edge);stroke-width:1.25}.dg .strong{fill:var(--accent);fill-opacity:.1;stroke:var(--accent);stroke-width:2}.dg .wire{fill:none;stroke:var(--edge);stroke-width:1.25}.dg .good{fill:var(--good-ink)}.dg .bad{fill:var(--bad-ink)}.dg .warn{fill:var(--warn-ink)}.dg .acc{fill:var(--accent)}</style><defs><marker id="dg-arr-without-a-tunnel-ad-bloc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--edge)"/></marker></defs><rect width="760" height="262" rx="12" style="fill:var(--bg)"/><text x="24" y="34" class="lbl">WITHOUT A TUNNEL</text><rect x="24" y="50" width="200" height="60" rx="8" class="box"/><text x="38" y="76" class="n m" style="font-size:13px">example.com</text><text x="38" y="95" class="s q">your app in the browser</text><rect x="536" y="50" width="200" height="60" rx="8" class="box"/><text x="550" y="76" class="n m" style="font-size:13px">sentry.io</text><text x="550" y="95" class="s q">Sentry's ingest</text><path d="M224 80H534" class="wire" marker-end="url(#dg-arr-without-a-tunnel-ad-bloc)"/><path d="M370 70L390 90M390 70L370 90" style="stroke:var(--bad);stroke-width:2.5;stroke-linecap:round"/><text x="380" y="108" text-anchor="middle" class="s n bad">blocked by ad blockers</text><text x="24" y="166" class="lbl">WITH A TUNNEL</text><rect x="24" y="182" width="200" height="60" rx="8" class="box"/><text x="38" y="208" class="n m" style="font-size:13px">example.com</text><text x="38" y="227" class="s q">your app in the browser</text><rect x="280" y="182" width="200" height="60" rx="8" class="strong"/><text x="294" y="208" class="n m" style="font-size:13px">example.com/tunnel</text><text x="294" y="227" class="s q">same origin, forwards it</text><rect x="536" y="182" width="200" height="60" rx="8" class="box"/><text x="550" y="208" class="n m" style="font-size:13px">sentry.io</text><text x="550" y="227" class="s q">Sentry's ingest</text><path d="M224 212H278" class="wire" marker-end="url(#dg-arr-without-a-tunnel-ad-bloc)"/><path d="M480 212H534" class="wire" marker-end="url(#dg-arr-without-a-tunnel-ad-bloc)"/></svg>