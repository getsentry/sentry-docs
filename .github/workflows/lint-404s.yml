name: Lint Docs for 404s

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-404:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v4
        id: setup-node
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'includes/**'
              - 'platform-includes/**'
              - 'scripts/lint-404s/**'
            dev-docs:
              - 'develop-docs/**'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ steps.setup-node.outputs.node-version }}-

      - run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm build
        if: steps.filter.outputs.docs == 'true'
        env:
          SENTRY_DSN: https://examplePublicKey@o0.ingest.sentry.io/0
          NEXT_PUBLIC_SENTRY_DSN: https://examplePublicKey@o0.ingest.sentry.io/0

      - name: Lint docs for 404s
        if: steps.filter.outputs.docs == 'true'
        run: |
          pnpm start &
          server_pid=$!
          cleanup() {
            port_pids="$(lsof -t -i:3000 || true)"
            if [[ -n "$port_pids" ]]; then
              kill $port_pids || true
            fi
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            ! lsof -t -i:3000 >/dev/null
          }
          trap cleanup EXIT
          for _ in {1..60}; do
            curl --silent --fail http://localhost:3000/sitemap.xml >/dev/null && break
            kill -0 "$server_pid"
            sleep 1
          done
          curl --silent --fail http://localhost:3000/sitemap.xml >/dev/null
          npx tsx ./scripts/lint-404s/main.ts
        env:
          SENTRY_DSN: https://examplePublicKey@o0.ingest.sentry.io/0
          NEXT_PUBLIC_SENTRY_DSN: https://examplePublicKey@o0.ingest.sentry.io/0

      - name: Build developer docs
        run: pnpm build:developer-docs
        if: steps.filter.outputs.dev-docs == 'true'
        env:
          SENTRY_DSN: https://examplePublicKey@o0.ingest.sentry.io/0
          NEXT_PUBLIC_SENTRY_DSN: https://examplePublicKey@o0.ingest.sentry.io/0

      - name: Lint developer docs for 404s
        if: steps.filter.outputs.dev-docs == 'true'
        run: |
          pnpm start &
          server_pid=$!
          cleanup() {
            port_pids="$(lsof -t -i:3000 || true)"
            if [[ -n "$port_pids" ]]; then
              kill $port_pids || true
            fi
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            ! lsof -t -i:3000 >/dev/null
          }
          trap cleanup EXIT
          for _ in {1..60}; do
            curl --silent --fail http://localhost:3000/sitemap.xml >/dev/null && break
            kill -0 "$server_pid"
            sleep 1
          done
          curl --silent --fail http://localhost:3000/sitemap.xml >/dev/null
          npx tsx ./scripts/lint-404s/main.ts --internal-hostname develop.sentry.dev
        env:
          SENTRY_DSN: https://examplePublicKey@o0.ingest.sentry.io/0
          NEXT_PUBLIC_SENTRY_DSN: https://examplePublicKey@o0.ingest.sentry.io/0
