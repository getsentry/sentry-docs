name: Triage Backtest

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of issues to evaluate
        required: true
        default: 50
        type: number
      state:
        description: GitHub issue state
        required: true
        default: open
        type: choice
        options: [open, closed, all]

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run read-only backlog simulation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LIMIT: ${{ inputs.limit }}
          STATE: ${{ inputs.state }}
        run: >-
          pnpm triage:backtest --limit "$LIMIT" --state "$STATE"
          --output .flue/output/backtest
      - name: Upload review tables
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: triage-backtest-${{ github.run_id }}
          path: .flue/output/backtest
          if-no-files-found: error
