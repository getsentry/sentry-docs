name: Triage Issue Shadow Run

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: number

concurrency:
  group: flue-triage-shadow
  cancel-in-progress: false
  queue: max

jobs:
  triage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.FLUE_TRIAGE_SHADOW_ENABLED == 'true' && github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       (github.event.comment.user.login == 'linear-code' ||
        github.event.comment.user.login == 'linear-code[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Parse issue number
        id: issue
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "number=$INPUT_ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "number=$EVENT_ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Run read-only triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TRIAGE_OUTPUT: .flue/output/triage-${{ steps.issue.outputs.number }}.json
        run: pnpm triage:shadow --issue ${{ steps.issue.outputs.number }}

      - name: Upload triage decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: triage-${{ steps.issue.outputs.number }}
          path: .flue/output/triage-${{ steps.issue.outputs.number }}.json
          if-no-files-found: error
