name: Bump @sentry/api (old dispatch name)
on:
  # getsentry/sentry dispatches this file by name until it switches to
  # bump-sentry-api.yml. Delete this file once it has.
  workflow_dispatch:
concurrency:
  group: bump-sentry-api
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  bump:
    name: 'Bump @sentry/api'
    uses: getsentry/sentry/.github/workflows/bump-sentry-api-consumer.yml@master
    with:
      pin: dependency
      mode: merge
      app-client-id: ${{ vars.SENTRY_API_SCHEMA_UPDATER_APP_CLIENT_ID }}
      commit-author-name: 'sentry-api-schema-updater[bot]'
      commit-author-email: '271575301+sentry-api-schema-updater[bot]@users.noreply.github.com'
    secrets:
      app-private-key: ${{ secrets.SENTRY_API_SCHEMA_UPDATER_PRIVATE_KEY }}
